<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TeachBoard</title>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:#0d0d1a;height:100vh;overflow:hidden;display:flex;flex-direction:column;color:#fff;}

/* ======= HOME ======= */
#home{position:fixed;inset:0;background:radial-gradient(ellipse at 30% 40%,#1a1040 0%,#0d0d1a 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;gap:24px;padding:40px 20px;overflow-y:auto;}
.logo{font-family:'Kalam',cursive;font-size:clamp(30px,6vw,52px);color:#fff;}
.logo span{color:#4f8ef7;}
.logo-sub{color:rgba(255,255,255,0.35);font-size:13px;margin-top:-18px;}
.nb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px;max-width:820px;width:100%;}
.nb-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:20px 14px;text-align:center;cursor:pointer;transition:all 0.2s;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;min-height:146px;}
.nb-card:hover{background:rgba(255,255,255,0.09);transform:translateY(-4px);border-color:rgba(79,142,247,0.3);box-shadow:0 10px 28px rgba(79,142,247,0.1);}
.nb-book{width:50px;height:66px;border-radius:3px 10px 10px 3px;position:relative;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:-3px 3px 10px rgba(0,0,0,0.5);}
.nb-book::after{content:'';position:absolute;left:0;top:0;width:8px;height:100%;background:rgba(0,0,0,0.2);border-radius:3px 0 0 3px;}
.nb-card span{color:rgba(255,255,255,0.8);font-size:13px;font-weight:500;word-break:break-word;line-height:1.3;}
.nb-card small{color:rgba(255,255,255,0.3);font-size:11px;}
.nb-del{position:absolute;top:8px;right:8px;background:rgba(239,68,68,0.15);border:none;color:#f87171;width:24px;height:24px;border-radius:50%;cursor:pointer;display:none;align-items:center;justify-content:center;font-size:13px;}
.nb-card:hover .nb-del{display:flex;}
.nb-del:hover{background:rgba(239,68,68,0.35);}
.nb-add{border:2px dashed rgba(79,142,247,0.3);color:#4f8ef7;background:rgba(79,142,247,0.04);}
.nb-add:hover{background:rgba(79,142,247,0.1);border-color:rgba(79,142,247,0.5);}

/* Dialog */
.dlg-bg{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:none;align-items:center;justify-content:center;z-index:500;}
.dlg-bg.open{display:flex;}
.dlg{background:#1c1c32;border:1px solid rgba(255,255,255,0.1);border-radius:18px;padding:26px;width:330px;max-width:90vw;}
.dlg h3{color:#fff;font-size:16px;font-weight:600;margin-bottom:16px;}
.dlg input{width:100%;padding:10px 12px;border-radius:9px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:#fff;font-size:14px;margin-bottom:12px;outline:none;font-family:'DM Sans',sans-serif;}
.dlg input:focus{border-color:rgba(79,142,247,0.5);}
.dlg input::placeholder{color:rgba(255,255,255,0.3);}
.dlg-lbl{color:rgba(255,255,255,0.35);font-size:11px;margin-bottom:8px;}
.cover-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px;}
.cover-c{width:28px;height:36px;border-radius:2px 7px 7px 2px;cursor:pointer;border:2px solid transparent;transition:all 0.15s;}
.cover-c.sel{border-color:#fff;transform:scale(1.12);}
.dlg-btns{display:flex;gap:8px;justify-content:flex-end;}
.dlg-btns button{padding:8px 18px;border-radius:9px;border:none;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500;}
.b-cancel{background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.6);}
.b-ok{background:#4f8ef7;color:#fff;}
.b-ok:hover{background:#3b7ef0;}

/* ======= APP ======= */
#app{display:none;height:100vh;flex-direction:row;}
#app.show{display:flex;}

/* Sidebar */
#sb{width:200px;background:#13132a;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,0.06);}
.sb-back{display:flex;align-items:center;gap:6px;padding:11px 13px;color:rgba(255,255,255,0.4);font-size:12px;cursor:pointer;border:none;background:none;border-bottom:1px solid rgba(255,255,255,0.06);transition:color 0.15s;width:100%;text-align:left;}
.sb-back:hover{color:#4f8ef7;}
.sb-head{padding:12px 13px 8px;}
.sb-title{font-family:'Kalam',cursive;color:#fff;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sb-sub{color:rgba(255,255,255,0.3);font-size:11px;margin-top:2px;}
.sb-list{flex:1;overflow-y:auto;padding:4px 0;}
.sb-list::-webkit-scrollbar{width:3px;}
.sb-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:2px;}
.pg-item{display:flex;align-items:center;padding:7px 13px;cursor:pointer;color:rgba(255,255,255,0.45);font-size:12px;gap:7px;transition:all 0.15s;}
.pg-item:hover{background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.8);}
.pg-item.active{background:rgba(79,142,247,0.1);color:#4f8ef7;}
.pg-num{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0;}
.pg-item.active .pg-num{background:rgba(79,142,247,0.2);}
.pg-lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pg-del{opacity:0;background:none;border:none;color:#f87171;cursor:pointer;font-size:12px;padding:2px 4px;}
.pg-item:hover .pg-del{opacity:1;}
.sb-foot{padding:10px 13px;border-top:1px solid rgba(255,255,255,0.06);}
.add-pg{width:100%;padding:7px;border-radius:9px;background:rgba(79,142,247,0.1);border:1px dashed rgba(79,142,247,0.25);color:#4f8ef7;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:5px;transition:all 0.15s;}
.add-pg:hover{background:rgba(79,142,247,0.18);}

/* Main area */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}

/* ======= TOOLBAR (single row, always visible) ======= */
#tb{
  background:#16162e;border-bottom:1px solid rgba(255,255,255,0.06);
  display:flex;align-items:center;padding:0 8px;gap:2px;flex-shrink:0;
  height:52px;overflow-x:auto;overflow-y:visible;
}
#tb::-webkit-scrollbar{height:2px;}
#tb::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);}
.sp{width:1px;height:24px;background:rgba(255,255,255,0.08);margin:0 4px;flex-shrink:0;}

/* Tool button */
.t{width:34px;height:34px;border-radius:8px;background:none;border:none;color:rgba(255,255,255,0.55);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all 0.15s;flex-shrink:0;position:relative;}
.t:hover{background:rgba(255,255,255,0.08);color:#fff;}
.t.on{background:rgba(79,142,247,0.22);color:#4f8ef7;}
.t.on.er{background:rgba(239,68,68,0.15);color:#f87171;}
.t svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

/* ── PEN TYPE BUTTONS (always visible) ── */
.pen-row{display:flex;align-items:center;gap:2px;flex-shrink:0;}
.pt{height:28px;padding:0 8px;border-radius:7px;background:none;border:1px solid transparent;color:rgba(255,255,255,0.4);cursor:pointer;font-size:11px;font-family:'DM Sans',sans-serif;transition:all 0.15s;white-space:nowrap;flex-shrink:0;}
.pt:hover{background:rgba(255,255,255,0.07);color:#fff;}
.pt.on{background:rgba(79,142,247,0.18);border-color:rgba(79,142,247,0.4);color:#4f8ef7;}

/* ── SHAPE BUTTONS (always visible) ── */
.sh-row{display:flex;align-items:center;gap:2px;flex-shrink:0;}
.sh{width:30px;height:30px;border-radius:7px;background:none;border:1px solid transparent;color:rgba(255,255,255,0.5);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all 0.15s;flex-shrink:0;}
.sh:hover{background:rgba(255,255,255,0.07);color:#fff;}
.sh.on{background:rgba(124,58,237,0.2);border-color:rgba(124,58,237,0.4);color:#a78bfa;}
.sh svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

/* ── COLOR DOTS ── */
.c-row{display:flex;gap:3px;align-items:center;flex-shrink:0;}
.cd{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all 0.15s;flex-shrink:0;}
.cd.on{border-color:#fff;transform:scale(1.2);}
.cd:hover{transform:scale(1.15);}

/* ── SIZE & OPACITY ── */
.sl-g{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.sl-g span{color:rgba(255,255,255,0.35);font-size:10px;min-width:22px;}
.sl-g label{color:rgba(255,255,255,0.3);font-size:10px;white-space:nowrap;}
.sl-g input[type=range]{width:60px;accent-color:#4f8ef7;cursor:pointer;}

/* ── PAGE NAV ── */
.pg-nav{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,0.05);border-radius:8px;padding:3px 7px;flex-shrink:0;margin-left:auto;}
.pg-nav button{background:none;border:none;color:rgba(255,255,255,0.5);cursor:pointer;font-size:14px;padding:2px 4px;border-radius:5px;transition:all 0.15s;}
.pg-nav button:hover{color:#fff;background:rgba(255,255,255,0.1);}
.pg-nav span{color:rgba(255,255,255,0.6);font-size:12px;min-width:40px;text-align:center;font-weight:500;}

/* ── ERASER MODES ── */
.er-row{display:flex;align-items:center;gap:2px;flex-shrink:0;}
.er{height:28px;padding:0 9px;border-radius:7px;background:none;border:1px solid transparent;color:rgba(255,255,255,0.4);cursor:pointer;font-size:11px;font-family:'DM Sans',sans-serif;transition:all 0.15s;white-space:nowrap;flex-shrink:0;}
.er:hover{background:rgba(255,255,255,0.07);color:#fff;}
.er.on{background:rgba(239,68,68,0.15);border-color:rgba(239,68,68,0.35);color:#f87171;}

/* section label */
.tb-lbl{color:rgba(255,255,255,0.2);font-size:9px;white-space:nowrap;flex-shrink:0;}

/* Canvas */
#cwrap{flex:1;overflow:hidden;position:relative;background:#fdfcf7;}
#cv{display:block;touch-action:none;position:absolute;top:0;left:0;cursor:crosshair;}
#selbox{position:absolute;border:2px dashed #4f8ef7;background:rgba(79,142,247,0.07);pointer-events:none;display:none;border-radius:2px;}

/* Status */
#statbar{height:24px;background:#16162e;border-top:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0;}
.st{color:rgba(255,255,255,0.25);font-size:10px;}
.std{width:6px;height:6px;border-radius:50%;background:#22c55e;flex-shrink:0;}

/* tooltip */
.t[title]:hover::after,.sh[title]:hover::after{content:attr(title);position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#fff;font-size:10px;padding:2px 7px;border-radius:5px;white-space:nowrap;z-index:99;pointer-events:none;}
</style>
</head>
<body>

<!-- HOME SCREEN -->
<div id="home">
  <div class="logo">✏️ Teach<span>Board</span></div>
  <div class="logo-sub">Digital teaching notebooks</div>
  <div class="nb-grid" id="nbGrid"></div>
</div>

<!-- DIALOG -->
<div class="dlg-bg" id="dlgBg">
  <div class="dlg">
    <h3>📓 New Notebook</h3>
    <input id="nbIn" type="text" placeholder="e.g. Physics, Maths, Chemistry" maxlength="40">
    <div class="dlg-lbl">Cover color</div>
    <div class="cover-row" id="coverRow"></div>
    <div class="dlg-btns">
      <button class="b-cancel" onclick="closeDlg()">Cancel</button>
      <button class="b-ok" onclick="createNb()">Create ✓</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <!-- Sidebar -->
  <div id="sb">
    <button class="sb-back" onclick="goHome()">← All Notebooks</button>
    <div class="sb-head">
      <div class="sb-title" id="sbTitle">Notebook</div>
      <div class="sb-sub" id="sbSub">0 pages</div>
    </div>
    <div class="sb-list" id="sbList"></div>
    <div class="sb-foot">
      <button class="add-pg" onclick="addPage()">＋ Add Page</button>
    </div>
  </div>

  <!-- Main -->
  <div id="main">
    <!-- TOOLBAR -->
    <div id="tb">

      <!-- SELECT -->
      <button class="t on" id="bSel" onclick="activateTool('select')" title="Select">
        <svg viewBox="0 0 24 24"><path d="M5 3l14 9-7 1-4 7z" fill="currentColor"/></svg>
      </button>
      <div class="sp"></div>

      <!-- PEN label + types -->
      <span class="tb-lbl">Pen</span>
      <div class="pen-row">
        <button class="pt on" id="pt-normal" onclick="setPen('normal')">✏️ Normal</button>
        <button class="pt" id="pt-highlighter" onclick="setPen('highlighter')">🖊 Highlight</button>
        <button class="pt" id="pt-temp" onclick="setPen('temp')">💨 Temp</button>
        <button class="pt" id="pt-calligraphy" onclick="setPen('calligraphy')">🪶 Calli</button>
      </div>
      <div class="sp"></div>

      <!-- SHAPES label + shapes -->
      <span class="tb-lbl">Shapes</span>
      <div class="sh-row">
        <button class="sh" id="sh-line" onclick="setShape('line')" title="Line">
          <svg viewBox="0 0 24 24"><line x1="4" y1="20" x2="20" y2="4"/></svg>
        </button>
        <button class="sh" id="sh-dline" onclick="setShape('dline')" title="Dotted Line">
          <svg viewBox="0 0 24 24"><line x1="4" y1="20" x2="20" y2="4" stroke-dasharray="4 3"/></svg>
        </button>
        <button class="sh" id="sh-rect" onclick="setShape('rect')" title="Rectangle">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/></svg>
        </button>
        <button class="sh" id="sh-circle" onclick="setShape('circle')" title="Circle/Ellipse">
          <svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="7"/></svg>
        </button>
        <button class="sh" id="sh-triangle" onclick="setShape('triangle')" title="Triangle">
          <svg viewBox="0 0 24 24"><polygon points="12,4 21,20 3,20"/></svg>
        </button>
        <button class="sh" id="sh-arrow" onclick="setShape('arrow')" title="Arrow">
          <svg viewBox="0 0 24 24"><line x1="4" y1="12" x2="18" y2="12"/><polyline points="13 7 18 12 13 17"/></svg>
        </button>
        <button class="sh" id="sh-star" onclick="setShape('star')" title="Star">⭐</button>
        <button class="sh" id="sh-heart" onclick="setShape('heart')" title="Heart">❤️</button>
      </div>
      <div class="sp"></div>

      <!-- FILL -->
      <button class="t" id="bFill" onclick="activateTool('fill')" title="Fill Color">
        <svg viewBox="0 0 24 24"><path d="M19 11l-8-8-8.5 8.5a5.5 5.5 0 007.78 7.78z"/><path d="M20 16s0 4 2 4-2-4-2-4"/></svg>
      </button>
      <div class="sp"></div>

      <!-- ERASER label + modes -->
      <span class="tb-lbl">Erase</span>
      <div class="er-row">
        <button class="er on" id="er-normal" onclick="setEraser('normal')">Normal</button>
        <button class="er" id="er-area" onclick="setEraser('area')">Area</button>
      </div>
      <!-- eraser activate -->
      <button class="t er" id="bErase" onclick="activateTool('eraser')" title="Eraser">
        <svg viewBox="0 0 24 24"><path d="M20 20H7L3 16l11-11 6 6z"/><path d="M6.5 11.5l3 3"/></svg>
      </button>
      <div class="sp"></div>

      <!-- UNDO REDO -->
      <button class="t" onclick="undo()" title="Undo Ctrl+Z">
        <svg viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M3 13A9 9 0 1012 4.5"/></svg>
      </button>
      <button class="t" onclick="redo()" title="Redo Ctrl+Y">
        <svg viewBox="0 0 24 24"><path d="M21 7v6h-6"/><path d="M21 13A9 9 0 1012 4.5"/></svg>
      </button>
      <div class="sp"></div>

      <!-- COLORS -->
      <span class="tb-lbl">Color</span>
      <div class="c-row" id="colorRow"></div>
      <div class="sp"></div>

      <!-- SIZE -->
      <div class="sl-g">
        <label>Size</label>
        <input type="range" min="1" max="30" value="3" id="szR" oninput="cs.size=+this.value;document.getElementById('szV').textContent=this.value">
        <span id="szV">3</span>
      </div>
      <div class="sp"></div>

      <!-- OPACITY -->
      <div class="sl-g">
        <label>Opacity</label>
        <input type="range" min="10" max="100" value="100" id="opR" oninput="cs.opacity=+this.value/100;document.getElementById('opV').textContent=this.value+'%'">
        <span id="opV">100%</span>
      </div>

      <!-- PAGE NAV -->
      <div class="pg-nav">
        <button onclick="prevPage()">‹</button>
        <span id="pgInd">1 / 1</span>
        <button onclick="nextPage()">›</button>
      </div>
    </div>

    <!-- CANVAS -->
    <div id="cwrap">
      <canvas id="cv"></canvas>
      <div id="selbox"></div>
    </div>

    <!-- STATUS -->
    <div id="statbar">
      <div class="std"></div>
      <span class="st" id="stSaved">Saved ✓</span>
      <span class="st">|</span>
      <span class="st" id="stTool">Tool: Select</span>
      <span class="st">|</span>
      <span class="st" id="stXY">x:0 y:0</span>
    </div>
  </div>
</div>

<script>
// ── DATA ──
const SK='tb_v4';
const COLORS=['#111111','#ef4444','#f97316','#eab308','#22c55e','#06b6d4','#4f8ef7','#8b5cf6','#ec4899','#ffffff'];
const COVERS=['#2563eb','#dc2626','#16a34a','#ca8a04','#7c3aed','#db2777','#0891b2','#334155'];

let st={notebooks:[],curNb:null,curPage:0};
let cs={tool:'select',penType:'normal',shapeType:'line',eraserType:'normal',color:'#111111',size:3,opacity:1};
let drawing=false,lx=0,ly=0,sx=0,sy=0;
let undoS=[],redoS=[];
let shapeSnap=null,shapeOn=false;
let eSelOn=false,eSx=0,eSy=0;
let tempLines=[];
let selColor=COVERS[0];

function load(){try{const s=localStorage.getItem(SK);if(s)st=JSON.parse(s);}catch(e){}if(!st.notebooks)st.notebooks=[];}
function save(){localStorage.setItem(SK,JSON.stringify(st));document.getElementById('stSaved').textContent='Saved ✓';}
function curNb(){return st.notebooks.find(n=>n.id===st.curNb);}
function curPg(){const nb=curNb();return nb?nb.pages[st.curPage]:null;}

// ── HOME ──
function renderHome(){
  const g=document.getElementById('nbGrid');g.innerHTML='';
  st.notebooks.forEach((nb,i)=>{
    const c=document.createElement('div');c.className='nb-card';
    c.innerHTML=`<div class="nb-book" style="background:${nb.color}">📚</div>
      <span>${nb.name}</span><small>${nb.pages.length} page${nb.pages.length!==1?'s':''}</small>
      <button class="nb-del" onclick="delNb(event,${i})">✕</button>`;
    c.addEventListener('click',()=>openNb(i));g.appendChild(c);
  });
  const a=document.createElement('div');a.className='nb-card nb-add';
  a.innerHTML='<div style="font-size:30px;opacity:0.6">+</div><span>New Notebook</span>';
  a.onclick=openDlg;g.appendChild(a);
}
function openDlg(){
  selColor=COVERS[0];
  const r=document.getElementById('coverRow');r.innerHTML='';
  COVERS.forEach((c,i)=>{
    const d=document.createElement('div');d.className='cover-c'+(i===0?' sel':'');
    d.style.background=c;
    d.onclick=()=>{selColor=c;r.querySelectorAll('.cover-c').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');};
    r.appendChild(d);
  });
  document.getElementById('nbIn').value='';
  document.getElementById('dlgBg').classList.add('open');
  setTimeout(()=>document.getElementById('nbIn').focus(),80);
}
function closeDlg(){document.getElementById('dlgBg').classList.remove('open');}
function createNb(){
  const name=document.getElementById('nbIn').value.trim()||'Notebook';
  st.notebooks.push({id:Date.now()+'',name,color:selColor,pages:[{id:Date.now()+'p',label:'Page 1',img:null}]});
  save();closeDlg();renderHome();
}
function delNb(e,i){e.stopPropagation();if(!confirm('Delete notebook?'))return;st.notebooks.splice(i,1);save();renderHome();}
function openNb(i){
  st.curNb=st.notebooks[i].id;st.curPage=0;save();
  document.getElementById('home').style.display='none';
  document.getElementById('app').classList.add('show');
  initCanvas();renderSb();loadPage();renderPgInd();
}
function goHome(){savePage();document.getElementById('app').classList.remove('show');document.getElementById('home').style.display='flex';renderHome();}

// ── SIDEBAR ──
function renderSb(){
  const nb=curNb();if(!nb)return;
  document.getElementById('sbTitle').textContent=nb.name;
  document.getElementById('sbSub').textContent=nb.pages.length+' page'+(nb.pages.length!==1?'s':'');
  const list=document.getElementById('sbList');list.innerHTML='';
  nb.pages.forEach((p,i)=>{
    const el=document.createElement('div');el.className='pg-item'+(i===st.curPage?' active':'');
    el.innerHTML=`<div class="pg-num">${i+1}</div><span class="pg-lbl">${p.label}</span>
      <button class="pg-del" onclick="delPage(event,${i})">✕</button>`;
    el.addEventListener('click',()=>goPage(i));list.appendChild(el);
  });
}
function addPage(){savePage();const nb=curNb();nb.pages.push({id:Date.now()+'',label:'Page '+(nb.pages.length+1),img:null});st.curPage=nb.pages.length-1;save();renderSb();loadPage();renderPgInd();}
function delPage(e,i){e.stopPropagation();const nb=curNb();if(nb.pages.length===1){alert('Need at least 1 page!');return;}if(!confirm('Delete page?'))return;nb.pages.splice(i,1);if(st.curPage>=nb.pages.length)st.curPage=nb.pages.length-1;save();renderSb();loadPage();renderPgInd();}
function goPage(i){savePage();st.curPage=i;renderSb();loadPage();renderPgInd();}
function prevPage(){if(st.curPage>0)goPage(st.curPage-1);}
function nextPage(){const nb=curNb();if(st.curPage<nb.pages.length-1)goPage(st.curPage+1);}
function renderPgInd(){const nb=curNb();document.getElementById('pgInd').textContent=(st.curPage+1)+' / '+nb.pages.length;}

// ── CANVAS ──
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
function initCanvas(){const w=document.getElementById('cwrap');cv.width=w.clientWidth||900;cv.height=w.clientHeight||600;drawLines();}
function drawLines(){
  ctx.fillStyle='#fdfcf7';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.strokeStyle='#e4ddd0';ctx.lineWidth=0.6;
  for(let y=50;y<cv.height;y+=30){ctx.beginPath();ctx.moveTo(50,y);ctx.lineTo(cv.width-10,y);ctx.stroke();}
  ctx.strokeStyle='rgba(240,100,100,0.35)';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(70,0);ctx.lineTo(70,cv.height);ctx.stroke();
}
function savePage(){const nb=curNb();if(!nb||!nb.pages[st.curPage])return;nb.pages[st.curPage].img=cv.toDataURL();save();}
function loadPage(){const p=curPg();initCanvas();undoS=[];redoS=[];if(p&&p.img){const img=new Image();img.onload=()=>{ctx.drawImage(img,0,0);snap();};img.src=p.img;}else snap();}
function snap(){undoS.push(cv.toDataURL());redoS=[];if(undoS.length>60)undoS.shift();}
function undo(){if(undoS.length<=1)return;redoS.push(undoS.pop());restore(undoS[undoS.length-1]);}
function redo(){if(!redoS.length)return;const s=redoS.pop();undoS.push(s);restore(s);}
function restore(d){const img=new Image();img.onload=()=>{initCanvas();ctx.drawImage(img,0,0);};img.src=d;}

// ── TOOL ACTIVATION ──
function activateTool(t){
  cs.tool=t;
  // reset all main tool buttons
  ['bSel','bFill','bErase'].forEach(id=>{const b=document.getElementById(id);if(b){b.classList.remove('on');}});
  const map={select:'bSel',fill:'bFill',eraser:'bErase'};
  const btn=document.getElementById(map[t]);
  if(btn)btn.classList.add('on');
  const curs={select:'default',fill:'crosshair',eraser:'cell',pen:'crosshair',shape:'crosshair'};
  cv.style.cursor=curs[t]||'crosshair';
  document.getElementById('stTool').textContent='Tool: '+t.charAt(0).toUpperCase()+t.slice(1);
}

function setPen(type){
  cs.penType=type;cs.tool='pen';
  // update pen buttons
  ['normal','highlighter','temp','calligraphy'].forEach(k=>{
    const b=document.getElementById('pt-'+k);if(b)b.classList.toggle('on',k===type);
  });
  // deactivate shape buttons
  document.querySelectorAll('.sh').forEach(b=>b.classList.remove('on'));
  activateTool('pen');
  document.getElementById('stTool').textContent='Tool: Pen ('+type+')';
}

function setShape(type){
  cs.shapeType=type;cs.tool='shape';
  // update shape buttons
  ['line','dline','rect','circle','triangle','arrow','star','heart'].forEach(k=>{
    const b=document.getElementById('sh-'+k);if(b)b.classList.toggle('on',k===type);
  });
  // deactivate pen buttons
  ['normal','highlighter','temp','calligraphy'].forEach(k=>{
    const b=document.getElementById('pt-'+k);if(b)b.classList.remove('on');
  });
  activateTool('shape');
  document.getElementById('stTool').textContent='Shape: '+type;
}

function setEraser(type){
  cs.eraserType=type;
  ['normal','area'].forEach(k=>{const b=document.getElementById('er-'+k);if(b)b.classList.toggle('on',k===type);});
}

// ── COLORS ──
function renderColors(){
  const row=document.getElementById('colorRow');row.innerHTML='';
  COLORS.forEach(c=>{
    const d=document.createElement('div');d.className='cd'+(c===cs.color?' on':'');
    d.style.background=c;
    if(c==='#ffffff')d.style.boxShadow='inset 0 0 0 1px rgba(200,200,200,0.5)';
    d.onclick=()=>{cs.color=c;row.querySelectorAll('.cd').forEach(x=>x.classList.remove('on'));d.classList.add('on');};
    row.appendChild(d);
  });
}

// ── DRAWING ──
function getP(e){const r=cv.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:(t.clientX-r.left)*(cv.width/r.width),y:(t.clientY-r.top)*(cv.height/r.height)};}
function h2r(hex,a){let r=0,g=0,b=0;if(hex.length===4){r=parseInt(hex[1]+hex[1],16);g=parseInt(hex[2]+hex[2],16);b=parseInt(hex[3]+hex[3],16);}else{r=parseInt(hex.slice(1,3),16);g=parseInt(hex.slice(3,5),16);b=parseInt(hex.slice(5,7),16);}return`rgba(${r},${g},${b},${a})`;}

cv.addEventListener('mousedown',sD);cv.addEventListener('mousemove',mD);cv.addEventListener('mouseup',eD);cv.addEventListener('mouseleave',eD);
cv.addEventListener('touchstart',e=>{e.preventDefault();sD(e);},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();mD(e);},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();eD(e);},{passive:false});
cv.addEventListener('mousemove',e=>{const p=getP(e);document.getElementById('stXY').textContent=`x:${Math.round(p.x)} y:${Math.round(p.y)}`;});

function sD(e){
  const{x,y}=getP(e);lx=x;ly=y;sx=x;sy=y;drawing=true;
  if(cs.tool==='fill'){floodFill(Math.round(x),Math.round(y),cs.color);snap();savePage();drawing=false;return;}
  if(cs.tool==='shape'){shapeOn=true;shapeSnap=cv.toDataURL();return;}
  if(cs.tool==='eraser'&&cs.eraserType==='area'){eSelOn=true;eSx=x;eSy=y;return;}
}
function mD(e){
  if(!drawing)return;
  const{x,y}=getP(e);
  if(cs.tool==='eraser'&&cs.eraserType==='area'&&eSelOn){
    const sb=document.getElementById('selbox'),r=cv.getBoundingClientRect(),scX=r.width/cv.width,scY=r.height/cv.height;
    sb.style.display='block';sb.style.left=Math.min(eSx,x)*scX+'px';sb.style.top=Math.min(eSy,y)*scY+'px';
    sb.style.width=Math.abs(x-eSx)*scX+'px';sb.style.height=Math.abs(y-eSy)*scY+'px';
    lx=x;ly=y;return;
  }
  if(cs.tool==='shape'&&shapeOn){
    const img=new Image();img.onload=()=>{initCanvas();ctx.drawImage(img,0,0);drawShape(sx,sy,x,y);};img.src=shapeSnap;
    lx=x;ly=y;return;
  }
  if(cs.tool==='pen'){
    ctx.lineCap='round';ctx.lineJoin='round';
    const pt=cs.penType;
    if(pt==='highlighter'){ctx.globalAlpha=0.3;ctx.lineWidth=cs.size*4;ctx.strokeStyle=cs.color;ctx.globalCompositeOperation='multiply';}
    else if(pt==='calligraphy'){ctx.globalAlpha=cs.opacity;ctx.lineWidth=cs.size*1.8;ctx.strokeStyle=h2r(cs.color,cs.opacity);ctx.globalCompositeOperation='source-over';}
    else{ctx.globalAlpha=cs.opacity;ctx.lineWidth=cs.size;ctx.strokeStyle=h2r(cs.color,cs.opacity);ctx.globalCompositeOperation='source-over';}
    ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(x,y);ctx.stroke();
    ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
    if(pt==='temp')tempLines.push({x1:lx,y1:ly,x2:x,y2:y,t:Date.now(),c:cs.color,s:cs.size,o:cs.opacity});
  }
  else if(cs.tool==='eraser'&&cs.eraserType==='normal'){
    ctx.globalCompositeOperation='destination-out';
    ctx.beginPath();ctx.arc(x,y,cs.size*3,0,Math.PI*2);ctx.fill();
    ctx.globalCompositeOperation='source-over';
    // restore lines
    ctx.strokeStyle='#e4ddd0';ctx.lineWidth=0.6;
    for(let yl=50;yl<cv.height;yl+=30){if(yl>y-50&&yl<y+50){ctx.beginPath();ctx.moveTo(50,yl);ctx.lineTo(cv.width-10,yl);ctx.stroke();}}
  }
  lx=x;ly=y;
}
function eD(e){
  if(!drawing)return;drawing=false;
  if(cs.tool==='eraser'&&cs.eraserType==='area'&&eSelOn){
    eSelOn=false;
    const x1=Math.min(eSx,lx),y1=Math.min(eSy,ly),w=Math.abs(lx-eSx),h=Math.abs(ly-eSy);
    ctx.fillStyle='#fdfcf7';ctx.fillRect(x1,y1,w,h);
    ctx.strokeStyle='#e4ddd0';ctx.lineWidth=0.6;
    for(let yl=50;yl<cv.height;yl+=30){if(yl>=y1-30&&yl<=y1+h+30){ctx.beginPath();ctx.moveTo(Math.max(50,x1),yl);ctx.lineTo(Math.min(cv.width-10,x1+w),yl);ctx.stroke();}}
    document.getElementById('selbox').style.display='none';snap();savePage();return;
  }
  if(cs.tool==='shape'&&shapeOn){shapeOn=false;snap();savePage();return;}
  if(cs.tool==='pen'||cs.tool==='eraser'){snap();savePage();}
}

function drawShape(x1,y1,x2,y2){
  const t=cs.shapeType;
  ctx.strokeStyle=cs.color;ctx.lineWidth=cs.size;ctx.globalAlpha=cs.opacity;
  ctx.lineCap='round';ctx.lineJoin='round';
  if(t==='line'){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
  else if(t==='dline'){ctx.setLineDash([8,5]);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([]);}
  else if(t==='rect'){ctx.beginPath();ctx.strokeRect(x1,y1,x2-x1,y2-y1);}
  else if(t==='circle'){const rx=Math.abs(x2-x1)/2,ry=Math.abs(y2-y1)/2;ctx.beginPath();ctx.ellipse((x1+x2)/2,(y1+y2)/2,Math.max(rx,1),Math.max(ry,1),0,0,Math.PI*2);ctx.stroke();}
  else if(t==='triangle'){ctx.beginPath();ctx.moveTo((x1+x2)/2,y1);ctx.lineTo(x2,y2);ctx.lineTo(x1,y2);ctx.closePath();ctx.stroke();}
  else if(t==='arrow'){
    const ang=Math.atan2(y2-y1,x2-x1),hs=14;
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-hs*Math.cos(ang-Math.PI/6),y2-hs*Math.sin(ang-Math.PI/6));ctx.lineTo(x2-hs*Math.cos(ang+Math.PI/6),y2-hs*Math.sin(ang+Math.PI/6));ctx.closePath();ctx.fillStyle=cs.color;ctx.fill();
  }
  else if(t==='star'||t==='heart'){
    const size=Math.max(Math.abs(x2-x1),Math.abs(y2-y1),24);
    ctx.globalAlpha=1;ctx.font=`${size}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(t==='star'?'⭐':'❤️',(x1+x2)/2,(y1+y2)/2);
    ctx.textAlign='left';
  }
  ctx.globalAlpha=1;
}

// Flood fill
function floodFill(sx,sy,fillColor){
  const img=ctx.getImageData(0,0,cv.width,cv.height),d=img.data;
  const i=(sy*cv.width+sx)*4;
  const tR=d[i],tG=d[i+1],tB=d[i+2],tA=d[i+3];
  let r=0,g=0,b=0;
  const hx=fillColor.replace('#','');
  if(hx.length===6){r=parseInt(hx.slice(0,2),16);g=parseInt(hx.slice(2,4),16);b=parseInt(hx.slice(4,6),16);}
  if(r===tR&&g===tG&&b===tB)return;
  const stk=[[sx,sy]];
  while(stk.length){
    const[cx,cy]=stk.pop();
    if(cx<0||cx>=cv.width||cy<0||cy>=cv.height)continue;
    const ci=(cy*cv.width+cx)*4;
    if(d[ci]!==tR||d[ci+1]!==tG||d[ci+2]!==tB||d[ci+3]!==tA)continue;
    d[ci]=r;d[ci+1]=g;d[ci+2]=b;d[ci+3]=255;
    stk.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);
  }
  ctx.putImageData(img,0,0);
}

// Temp ink fade
setInterval(()=>{
  if(!tempLines.length)return;
  const now=Date.now();
  if(!tempLines.some(l=>now-l.t>5000))return;
  if(undoS.length){
    const img=new Image();img.onload=()=>{initCanvas();ctx.drawImage(img,0,0);tempLines=tempLines.filter(l=>now-l.t<=5000);ctx.lineCap='round';tempLines.forEach(l=>{ctx.strokeStyle=h2r(l.c,l.o);ctx.lineWidth=l.s;ctx.beginPath();ctx.moveTo(l.x1,l.y1);ctx.lineTo(l.x2,l.y2);ctx.stroke();});savePage();};
    img.src=undoS[Math.max(0,undoS.length-2)];
  }
},1000);

// Keys
document.addEventListener('keydown',e=>{
  if(e.ctrlKey&&e.key==='z'){e.preventDefault();undo();}
  if(e.ctrlKey&&e.key==='y'){e.preventDefault();redo();}
  if(e.ctrlKey&&e.key==='s'){e.preventDefault();savePage();}
});
document.getElementById('nbIn').addEventListener('keydown',e=>{if(e.key==='Enter')createNb();if(e.key==='Escape')closeDlg();});
window.addEventListener('resize',()=>{if(document.getElementById('app').classList.contains('show')){savePage();setTimeout(()=>{initCanvas();loadPage();},100);}});

// ── INIT ──
load();renderHome();renderColors();
</script>
